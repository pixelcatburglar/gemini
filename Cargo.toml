[package]
name = "poc_server"
version = "0.1.0"
edition = "2024"
description = "Native Rust MachoNet and gameplay server for EVE Gemini build 665"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.1"
crc32fast = "1.5"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time"] }
tokio-postgres = "0.7.18"
bytes = "1.12"
pbkdf2 = { version = "0.13", features = ["sha2"] }
rand = "0.8"
hex = "0.4"
subtle = "2.6"
clap = { version = "4.6", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
